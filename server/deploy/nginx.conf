# nginx in front of the Fahrsim Baunatal server (instead of Caddy), for a server running on 127.0.0.1:8080
# with FAHRSIM_TRUST_PROXY=1. Certificates e.g. with certbot --nginx.
log_format fahrsim_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fahrsim.example.org;

    ssl_certificate     /etc/letsencrypt/live/fahrsim.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahrsim.example.org/privkey.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # replace (not append) so a client cannot smuggle its own address in
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        # log the path without its query string: a WebSocket URL carries the token
        access_log /var/log/nginx/fahrsim.log fahrsim_noquery;
    }
}

server {
    listen 80;
    server_name fahrsim.example.org;
    return 301 https://$host$request_uri;
}
