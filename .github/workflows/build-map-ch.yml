# SPDX-License-Identifier: AGPL-3.0-only
#
# Baut die Karte eines Teils der Schweiz und legt sie als Kartenpaket in ein Release
# (map.tar.00, map.tar.01, … – was das Spiel unter Einstellungen → Karte lädt).
#
# Warum das hier läuft: ein Bau braucht mehrere Gigabyte Platte und mehr Speicher, als ein
# Notebook hat; ein Läufer von GitHub hat 4 CPUs, 16 GB Speicher und ~14 GB Platte, und seine
# Minuten sind für ein öffentliches Repository frei.  Die Karte geht nie über GitHub Pages
# (dort sind es 1 GB): Releases haben keine Größenbeschränkung.
#
# Starten: Actions → "Karte Schweiz" → Run workflow.
#
# Die Reihenfolge ist die von docs/MAP_DATA.md:
#   1. Gelände (swissALTI3D, 2 m)                                 -> data/work/dgm2
#   2. OpenStreetMap, auf die Region geschnitten                  -> npm run map:extract
#   3. Straßennetz und Kacheln                                    -> npm run map:build
#   4. Adressen, Haltestellen, Linien, Schilder, Fernsicht, Tankstellen
#   5. in Teile von 100 MB gepackt und ins Release gelegt
#
# Die Region ist ein Rechteck aus UTM32-Kilometerquadraten (EPSG:25832), dasselbe Gitter, nach
# dem die Kacheln jeder Karte benannt sind: 382_5201 ist das Quadrat, in dem das Rathaus von
# Bern steht.  Ein Rechteck nach dem anderen: zwei Abläufe dürfen kein Kilometerquadrat
# gemeinsam haben (--published prüft das).
#
# Zwei Aufträge, damit ein Netzfehler während des Holens nicht den ganzen Bau verdirbt und
# damit jeder Teil seine sechs Stunden für sich hat.
#
# Keine Gebäudemodelle aus der amtlichen Quelle: swissBUILDINGS3D 3.0 ist zwar für CityGML
# angekündigt, im freien Kanal der offenen Geodaten stehen aber nur DWG und ESRI FileGDB
# (beides Formate mit Lizenzzwang).  Die Gebäude kommen darum aus OpenStreetMap.

name: Karte Schweiz

on:
  workflow_dispatch:
    inputs:
      east_from:
        description: 'Rechteck: erstes Kilometerquadrat nach Osten (UTM32, EPSG:25832)'
        type: string
        default: '375'
      east_to:
        description: 'Rechteck: letztes Kilometerquadrat nach Osten'
        type: string
        default: '389'
      north_from:
        description: 'Rechteck: erstes Kilometerquadrat nach Norden'
        type: string
        default: '5194'
      north_to:
        description: 'Rechteck: letztes Kilometerquadrat nach Norden'
        type: string
        default: '5208'
      label:
        description: Name der Karte (steht im Spiel und im map.json)
        type: string
        default: 'Bern und Umgebung'
      tag:
        description: 'Name des Releases (leer: karte-ch-<Datum>-<Lauf>)'
        type: string
        default: ''
      geodata_run:
        description: 'Lauf, aus dem schon geholte Geodaten übernommen werden (leer: alles neu holen)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read   # Artefakte eines früheren Laufs (geodata_run)

jobs:
  # 1: die offenen Geodaten des Bundesamtes für Landestopografie – das Holen
  geodata:
    timeout-minutes: 350
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy pillow
      # Was ein früherer Lauf schon geholt hat: das Skript läßt liegen, was da ist, und holt
      # nur, was fehlt.
      - name: Vorhandene Geodaten (aus dem Lauf geodata_run)
        if: ${{ inputs.geodata_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.geodata_run }}
        run: |
          set -euo pipefail
          name="geodata-ch"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?name=$name" --jq '.artifacts[0].id')
          echo "Artefakt von Lauf $RUN: $id"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o /tmp/$name.zip
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('data/work/dgm2')" "/tmp/$name.zip"
          du -sh data/work/dgm2
      # Kein Quadrat zweimal: der Index der schon veröffentlichten Karten sagt, welche
      # Kacheln von 500 m eine andere Karte hat; tools/fetch-ch.py läßt sie aus.
      - name: Index der schon veröffentlichten Karten
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 20 \
            -o "$RUNNER_TEMP/published-index.json" \
            https://raw.githubusercontent.com/${{ github.repository }}/main/map-assets/index.json
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/published-index.json'));print('Kacheln in anderen Karten:',len({t for f in d['files'] for t in f['tiles']}))"
      - name: Gelände (swissALTI3D, 2 m) holen
        env:
          BOX_E: ${{ inputs.east_from }}..${{ inputs.east_to }}
          BOX_N: ${{ inputs.north_from }}..${{ inputs.north_to }}
        run: |
          set -euo pipefail
          python3 -I tools/fetch-ch.py --east "$BOX_E" --north "$BOX_N" \
            --published "$RUNNER_TEMP/published-index.json" \
            --on-overlap skip --jobs 4 --gaps data/work/gaps.txt
          du -sh data/work/dgm2
      # auch nach einem Fehlschlag: Stunden von Holen sind sonst verloren, und der nächste
      # Lauf kann mit geodata_run hier weiterfahren
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodata-ch
          path: |
            data/work/dgm2
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # 2-5: OpenStreetMap, der Bau und das Release
  build:
    needs: geodata
    timeout-minutes: 350
    runs-on: ubuntu-latest
    env:
      # Die Werkzeuge lesen sonst data/raw/osm/hessen-latest.osm.pbf – jedes von ihnen
      # bekommt die Datei dieses Landes ausdrücklich.
      OSM: data/raw/osm/switzerland-latest.osm.pbf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nur ein Pfad wird hochgehoben, darum liegen die Kacheln selbst (nicht data/work/dgm2/…)
      # im Artefakt – hier genau dorthin zurück.
      - name: Geodaten des Rechtecks (aus dem ersten Auftrag)
        uses: actions/download-artifact@v4
        with:
          name: geodata-ch
          path: data/work/dgm2
      - name: Platz (der Läufer hat ~14 GB SSD; Android, .NET, Haskell und PowerShell braucht diese Karte nicht)
        run: |
          du -sh data/work/dgm2
          ls data/work/dgm2 | head -3
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          df -h /
      # Zwei Quellen, weil die erste gerade nicht liegt: auf 2026-11-21 zeigte
      # download.geofabrik.de/europe/switzerland-latest.osm.pbf auf
      # switzerland-261120.osm.pbf, und die antwortete 404 (der Stand vom Vortag war noch nicht
      # fertig geschrieben).  Die Auszüge von openstreetmap.fr sind dieselben Daten unter
      # derselben Lizenz (ODbL 1.0, © OpenStreetMap-Mitwirkende); sie sind der zweite Versuch.
      - name: OpenStreetMap (Geofabrik, Schweiz – sonst openstreetmap.fr)
        run: |
          mkdir -p data/raw/osm
          curl -fsSL --retry 5 --retry-delay 20 -o "$OSM" \
            https://download.geofabrik.de/europe/switzerland-latest.osm.pbf \
          || curl -fsSL --retry 5 --retry-delay 20 -o "$OSM" \
            https://download.openstreetmap.fr/extracts/europe/switzerland-latest.osm.pbf
          ls -l data/raw/osm
      # Gebaut wird nur, wo Gelände liegt (tools/osm-extract.ts) – das Rechteck ist die Karte.
      # DETAIL_REGION=all: die Feinheiten gelten in der ganzen Karte, es gibt hier keine
      # Vorgängerkarte, deren Bytes stehen bleiben müßten.
      - name: Kartenpaket 1/4 – OpenStreetMap in Blöcke von 8 km schneiden
        run: npm run map:extract -- "$OSM"
      - name: Kartenpaket 2/4 – Straßennetz und Kacheln
        env:
          DETAIL_REGION: all
        run: npm run map:build -- --jobs 3
      # Keine Fahrpläne: die Fahrplandaten der Schweiz (opentransportdata.swiss, Timetable
      # 2026 GTFS) verlangen ein Konto und einen Schlüssel, ohne den kein Ablauf sie lesen
      # darf; der freie Kanal von gtfs.de hat nur Deutschland.
      - name: Kartenpaket 3/4 – Adressen, Haltestellen, Linien, Schilder, Fernsicht, Tankstellen
        run: |
          npm run map:addresses
          npm run map:stops
          npm run map:lines -- "$OSM"
          npm run map:buslines -- "$OSM"
          npm run map:signs -- "$OSM"
          npm run map:far
          npm run map:services -- "$OSM"
      # Der Name steht in tools/build-graph.ts fest ('Nordhessen') und die Quellenzeile nennt
      # die hessische Verwaltung; beides wird hier berichtigt.  Der Wortlaut der
      # Namensnennung ist der, den swisstopo selbst nennt: „© swisstopo" nach den
      # "Terms of use for free geodata and geoservices (OGD) from swisstopo".
      - name: Der Name der Karte und ihre Quellenzeilen (map.json)
        env:
          NAME: ${{ inputs.label }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"), p = "public/map/map.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.meta.name = process.env.NAME;
            j.meta.attribution = [
              "Straßennetz, Verkehrsregelung, Flächennutzung, Gebäude: © OpenStreetMap-Mitwirkende (ODbL 1.0)",
              "Gelände (swissALTI3D): © swisstopo",
            ];
            fs.writeFileSync(p, JSON.stringify(j));
            console.log(j.meta.name, "-", j.nodes, "Knoten,", j.edges, "Kanten");
          '
      - name: Kartenpaket 4/4 – in Teile von 100 MB packen
        run: |
          npm run map:pack
          du -sh public/map
      - name: Kartenpaket hochheben (ehe das Release es will)
        uses: actions/upload-artifact@v4
        with:
          name: map-ch
          path: data/work/map.tar.*
          if-no-files-found: warn
          retention-days: 7
      - name: Ins Release legen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ inputs.tag }}
          LABEL: ${{ inputs.label }}
          BOX: ${{ inputs.east_from }}..${{ inputs.east_to }} / ${{ inputs.north_from }}..${{ inputs.north_to }}
        run: |
          set -euo pipefail
          tag="${WANTED:-karte-ch-$(date -u +%F)-r$GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Karte von $LABEL für den Fahrsimulator – im Spiel unter Einstellungen → Karte laden (Kartenpaket).

          Gebaut am $(date -u +%F) aus OpenStreetMap (ODbL 1.0) sowie dem Geländemodell swissALTI3D des
          Bundesamtes für Landestopografie swisstopo.  Dessen Nutzungsbedingungen für die freien
          Geodaten und Geodienste (OGD) erlauben jede Nutzung, auch kommerzielle, und verlangen nur
          die Namensnennung: „© swisstopo".  Rechteck aus Kilometerquadraten (UTM32): $BOX.

          Keine Fahrpläne darin: die Fahrplandaten der Schweiz (opentransportdata.swiss) verlangen ein
          Konto und einen Schlüssel.  Keine amtlichen Gebäudemodelle: swissBUILDINGS3D 3.0 steht im
          freien Kanal nur als DWG und ESRI FileGDB – die Gebäude kommen aus OpenStreetMap.
          EOF
          # (ein verwehrtes gh release create darf Stunden von Bau nicht wegwerfen: das Paket
          #  liegt schon als Artefakt oben; hier ein zweiter Versuch nach einer Weile)
          for versuch in 1 2 3; do
            if gh release create "$tag" --latest=false --target "$GITHUB_SHA" --title "Karte $LABEL" \
                 --notes-file notes.md data/work/map.tar.*; then
              break
            fi
            echo "Release $tag ging schief (Versuch $versuch); noch einmal in 60 s"
            sleep 60
          done
          echo "release $tag"
