name: TH source probe (temporary diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe candidate sources
        run: |
          set -u
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36'
          for u in \
            "https://geoportal.thueringen.de/gdi-th/download-offene-geodaten/download-hoehendaten" \
            "https://geoportal.thueringen.de/gdi-th/download-offene-geodaten/download-3d-gebaeudedaten" \
            "https://geoportal.geoportal-th.de/dienste/atom_th_hoehendaten_dgm" \
            "https://geoportal.geoportal-th.de/3dgebaeude/LoD2/LoD2_634_5616_2_TH.zip" \
            "https://www.geoproxy.geoportal-th.de/geoproxy/services/DGM?SERVICE=WCS&REQUEST=GetCapabilities&VERSION=1.0.0" \
            "https://www.geoproxy.geoportal-th.de/geoproxy/services/DGM?REQUEST=GetCapabilities&version=1.1.1&service=WMS" \
            "https://download.geofabrik.de/europe/germany/thueringen/thueringen-latest.osm.pbf" \
            ; do
            echo "=== $u"
            curl -sS -m 40 -A "$UA" -o /tmp/o -w "code=%{http_code} size=%{size_download} type=%{content_type}\n" "$u" || echo "curl failed"
            head -c 400 /tmp/o | tr -d '\0'
            echo
          done
      - name: What the height download page links to
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36'
          curl -sS -m 40 -A "$UA" "https://geoportal.thueringen.de/gdi-th/download-offene-geodaten/download-hoehendaten" -o /tmp/h.html
          echo "size: $(wc -c < /tmp/h.html)"
          grep -oE 'href="[^"]*"' /tmp/h.html | sort -u | grep -viE 'href="#|/gdi-th/|/themen/|\.css|\.js|thueringen\.de/(regierung|ts|)' | head -60
          echo "--- text mentioning dienste/atom/zip:"
          sed 's/<[^>]*>/ /g' /tmp/h.html | tr -s ' \n' ' \n' | grep -iE 'atom|dienste|\.zip|\.tif|kachel|wcs' | head -40
      - name: Follow the ATOM service feed
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36'
          for u in \
            "https://geoportal.geoportal-th.de/dienste/atom_th_hoehendaten_dgm" \
            "https://geoportal.geoportal-th.de/dienste/atom_th_hoehendaten_dgm?type=dataset&id=14418d25-fcd7-4a3f-99a9-e3059a2772af" \
            ; do
            echo "=== $u"
            curl -sS -m 40 -A "$UA" -o /tmp/a.xml -w "code=%{http_code} size=%{size_download}\n" "$u"
            head -c 600 /tmp/a.xml
            echo
            grep -oE 'href="[^"]*"' /tmp/a.xml | head -10
          done
