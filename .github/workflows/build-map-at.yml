# SPDX-License-Identifier: AGPL-3.0-only
#
# Baut die Karte eines Rechtecks im Westen Österreichs und legt sie als Kartenpaket
# (map.tar.00, map.tar.01, … – was das Spiel unter Einstellungen → Karte laden liest,
# src/ui/mappacks.ts) in ein Release.
#
# Der Aufbau ist der von .github/workflows/build-map-it.yml: zwei Aufträge, damit ein
# Netzfehler beim Holen des Geländes nicht den ganzen Bau kostet und jeder Teil seine
# eigenen Stunden hat.  Starten von Hand: Actions → "Karte Österreich-West" → Run workflow.
#
# Die Reihenfolge ist die von docs/MAP_DATA.md:
#   1. Gelände (BEV ALS-DTM-Höhenraster 1 m)                    -> data/work/dgm2
#   2. OpenStreetMap, auf das Rechteck geschnitten              -> npm run map:extract
#   3. Straßennetz und Kacheln                                  -> npm run map:build
#   4. Adressen, Haltestellen, Linien, Schilder, Fernsicht, Fahrpläne, Tankstellen
#   5. in Teile von 100 MB gepackt und ins Release gelegt
#
# Rechteck: Kilometerkacheln in UTM32 (EPSG:25832) – 556_5261 ist die Kachel mit der
# Bregenzer Innenstadt, 682_5238 die mit der Innsbrucker.
#
# Gelände: das ALS-DTM-Höhenraster 1 m des Bundesamtes für Eich- und Vermessungswesen,
# CC BY 4.0, kein Schlüssel, keine Anmeldung.  Das Land liegt in 55 Blättern von 50 km in
# EPSG:3035, jedes ein BigTIFF von 50001 × 50001 Pixeln (float32) in Kacheln von 512 × 512;
# der Server antwortet auf Bytebereiche, tools/fetch-at.py liest darum nur die Kacheln, die
# das Rechteck braucht.  Der Metadatensatz des Blattes nennt
#   otherConstraints → https://creativecommons.org/licenses/by/4.0/,
#   „Der öffentliche Zugang zu diesem Produkt unterliegt keinen Einschränkungen."
# und „ALS-Höhenraster 1 m: unentgeltlich".
#
# Gebäudemodelle sind keine da: Österreich hat kein offenes LoD2 – Bauwerkshöhen lägen nur
# im „Digitalen Landschaftsmodell – Bauwerke" (2,6 GB je Stand, eigene Einheiten zu schreiben
# wäre ein zweiter Bau).  Die Dächer kommen wie in Italien aus den OpenStreetMap-Umrissen.

name: Karte Österreich-West

on:
  workflow_dispatch:
    inputs:
      east:
        description: 'Rechteck: Kilometer nach Osten (UTM32), 556 oder 549..563'
        type: string
        default: '549..563'
      north:
        description: 'Rechteck: Kilometer nach Norden (UTM32), 5261 oder 5254..5268'
        type: string
        default: '5254..5268'
      label:
        description: Name der Karte (steht in map.json und im Release)
        type: string
        default: 'Bregenz'
      osm:
        # Geofabrik hält Österreich nur als ganzes Land und nicht je Bundesland
        # (vorarlberg-latest.osm.pbf u. a. antworten mit 404, nachgemessen am 21.11.2026);
        # austria-latest.osm.pbf ist 816 MB, ODbL 1.0, kein Schlüssel.
        description: OpenStreetMap-Ausschnitt von Geofabrik
        type: choice
        default: austria
        options: [austria]
      tag:
        description: 'Name des Releases (leer: karte-at-<Datum>-<Lauf>)'
        type: string
        default: ''
      gtfs_agency:
        description: Nahverkehrsbetriebe, deren Fahrpläne genommen werden (RegExp, wie build-timetable.ts sie erwartet)
        type: string
        # build-timetable.ts holt nur deutsche Fahrpläne (download.gtfs.de); österreichische
        # Betriebe findet es darin nicht.  Wer einen passenden Feed hat, kann ihn hier
        # eintragen – ohne Fund bleiben die Fahrpläne leer.
        default: 'ÖBB|VVV|VVT|IVB'
      gtfs_bus_agency:
        description: Dieselben für die Buslinien
        type: string
        default: 'ÖBB|VVV|VVT|IVB'
      jobs:
        description: Wie viele Nordreihen gleichzeitig gerechnet werden
        type: string
        default: '4'
      geodata_run:
        description: 'Lauf, aus dem schon geholte Geodaten übernommen werden (leer: alles neu holen)'

permissions:
  contents: write
  actions: read   # Artefakte eines früheren Laufs (geodata_run)

jobs:
  # 1: das Gelände – Höhen aus den BEV-Blättern rechnen (Kacheln von 512 × 512, je ~0,6 MB)
  geodata:
    timeout-minutes: 350
    runs-on: ubuntu-latest
    steps:
      # map-assets/ liegt im Repository (2,7 GB) und wird hier nicht gebraucht: index.json wird
      # aus dem Web geholt (unten), und kein Schritt des Baus liest die fertigen Karten.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !map-assets/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy pillow
      # Zwei Karten dürfen keine Kachel von 500 m teilen: map-assets/index.json sagt, was eine
      # andere Karte schon hat; das Skript lässt diese Kilometerraster weg.
      - name: Veröffentlichte Kacheln (map-assets/index.json)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 \
            -o map-assets-index.json \
            https://raw.githubusercontent.com/MaurerAnton/driving-simulator/main/map-assets/index.json
          python3 -c 'import json; i=json.load(open("map-assets-index.json")); print(len({t for f in i["files"] for t in f["tiles"]}), "Kacheln anderer Karten")'
      # Was ein früherer Lauf schon geholt hat: das Skript lässt liegen, was da ist, und holt nur,
      # was fehlt.
      - name: Vorhandene Geodaten (aus dem Lauf geodata_run)
        if: ${{ inputs.geodata_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.geodata_run }}
        run: |
          set -euo pipefail
          name=geodata-at
          echo "Artefakte von Lauf $RUN:"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?name=$name" --jq '.artifacts[0].id')
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o /tmp/$name.zip
          ls -l /tmp/$name.zip
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('data/work/dgm2')" "/tmp/$name.zip"
          du -sh data/work/dgm2
      - name: Gelände aus dem ALS-DTM-Höhenraster holen
        env:
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
          JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p data/work/dgm2
          python3 -I tools/fetch-at.py --east "$EAST" --north "$NORTH" --jobs "$JOBS" \
            --published map-assets-index.json --on-overlap skip --gaps data/work/gaps.txt
          du -sh data/work/dgm2
          ls data/work/dgm2 | wc -l
      # auch nach einem Fehlschlag: Stunden von Holen sind sonst verloren, und der nächste Lauf
      # kann mit geodata_run hier weiterfahren
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodata-at
          path: data/work/dgm2
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # 2-5: OpenStreetMap, der Bau und das Release
  build:
    needs: geodata
    timeout-minutes: 350
    runs-on: ubuntu-latest
    # Die Rechte werden auch hier genannt: das Repository gibt dem Token der Läufe von sich aus
    # nur Leserechte (actions/permissions/workflow: default_workflow_permissions "read"), und
    # ohne contents: write antwortet das Release mit
    # „HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write
    # Das Rechteck liegt außerhalb der Kästen von tools/mapgen/detail-region.json (die hessischen
    # Karten); „all" baut die ganze Karte mit dem feineren Netz, das nach dem veröffentlichten
    # Stand dazugekommen ist (Querschnitte, Parken, Gehwege, Markierungen, …).
    # OSM_FILE: osm-extract.ts, build-lines.ts, build-buslines.ts, build-signs.ts und
    # build-services.ts lesen die OSM-Datei aus process.argv[2] und nehmen ohne Argument
    # data/raw/osm/hessen-latest.osm.pbf – die es hier nicht gibt (ENOENT nach Stunden).
    env:
      DETAIL_REGION: all
      OSM_FILE: data/raw/osm/${{ inputs.osm }}-latest.osm.pbf
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !map-assets/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gelände (aus dem ersten Auftrag)
        uses: actions/download-artifact@v4
        with:
          name: geodata-at
          path: data/work/dgm2
      - name: Platz (der Läufer hat ~14 GB SSD; Android, .NET, Haskell und PowerShell braucht diese Karte nicht)
        run: |
          ls data/work
          du -sh data/work/dgm2
          ls data/work/dgm2 | head -3
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          df -h /
      - name: OpenStreetMap (Geofabrik, Österreich)
        env:
          OSM: ${{ inputs.osm }}
        run: |
          set -euo pipefail
          mkdir -p data/raw/osm
          # Kleinster Ausschnitt mit dem Rechteck: Geofabrik hält Österreich nur als ganzes
          # Land – die Bundesländer (vorarlberg-latest.osm.pbf, tirol-latest.osm.pbf, …)
          # antworten mit 404 (nachgemessen am 21.11.2026).  ODbL 1.0, kein Schlüssel.
          #
          # Die Adresse „…-latest" zeigt derzeit auf austria-261120.osm.pbf, das der Server
          # (noch) nicht hat – genau wie bei der Schweiz am selben Tag.  Darum werden die
          # Stände der letzten sieben Tage durchprobiert und erst danach auf den Spiegel von
          # openstreetmap.fr (974 MB, Stand 19.11.2026, dieselben Daten, dieselbe Lizenz)
          # zurückgefallen.
          urls="https://download.geofabrik.de/europe/$OSM-latest.osm.pbf"
          for back in 0 1 2 3 4 5 6 7; do
            urls="$urls https://download.geofabrik.de/europe/$OSM/$OSM-$(date -u -d "-$back day" +%y%m%d).osm.pbf"
          done
          urls="$urls https://download.openstreetmap.fr/extracts/europe/$OSM-latest.osm.pbf"
          for try in 1 2 3; do
            for url in $urls; do
              rm -f "$OSM_FILE"
              echo "Versuch: $url"
              curl -fsSL --retry 3 --retry-delay 30 --retry-all-errors --connect-timeout 60 \
                -o "$OSM_FILE" "$url" && break 2
              rm -f "$OSM_FILE"
            done
            echo "Runde $try: keine der Adressen hat geliefert"
            sleep 30
          done
          test -s "$OSM_FILE"
          ls -l data/raw/osm
      - name: Kartenpaket 1/4 – OpenStreetMap in Blöcke von 8 km schneiden
        run: |
          echo "OSM-Datei: $OSM_FILE"
          npm run map:extract -- "$OSM_FILE"
      - name: Kartenpaket 2/4 – Straßennetz und Kacheln
        run: npm run map:build -- --jobs 3
      - name: Kartenpaket 3/4 – Adressen, Haltestellen, Linien, Schilder, Fernsicht, Fahrpläne, Tankstellen
        env:
          GTFS_AGENCY: ${{ inputs.gtfs_agency }}
          GTFS_BUS_AGENCY: ${{ inputs.gtfs_bus_agency }}
        run: |
          npm run map:addresses
          npm run map:stops
          # diese vier lesen die OSM-Datei selbst (argv[2]), die anderen beiden das Netz
          npm run map:lines -- "$OSM_FILE"
          npm run map:buslines -- "$OSM_FILE"
          npm run map:signs -- "$OSM_FILE"
          npm run map:far
          npm run map:timetable
          npm run map:services -- "$OSM_FILE"
      # build-graph.ts schreibt Namen und Quellen der hessischen Karte („Nordhessen", Hessische
      # Verwaltung für Bodenmanagement und Geoinformation); hier stehen die von Österreich.
      - name: Der Name der Karte und ihre Quellen (map.json)
        env:
          NAME: ${{ inputs.label }}
          ATTRIBUTION: 'Gelände (ALS-DTM-Höhenraster 1 m): © Bundesamt für Eich- und Vermessungswesen (BEV), Wien 2025, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)'
        run: |
          node -e '
            const fs = require("fs"), p = "public/map/map.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.meta.name = process.env.NAME;
            const lines = (j.meta.attribution ?? []).filter((l) => !/Hessische|Hessen|DGM1|LoD2/i.test(l));
            lines.push(process.env.ATTRIBUTION);
            j.meta.attribution = lines;
            fs.writeFileSync(p, JSON.stringify(j));
            console.log(j.meta.name, "-", j.nodes, "Knoten,", j.edges, "Kanten");
            console.log(j.meta.attribution.join(" | "));
          '
      - name: Kartenpaket 4/4 – in Teile von 100 MB packen
        run: |
          npm run map:pack
          du -sh public/map
      # auch als Artefakt: ein Stunden langer Bau ist damit nicht verloren, wenn das Release
      # (oder der Platz beim Hochladen) doch einmal scheitert
      - uses: actions/upload-artifact@v4
        with:
          name: mappack-at
          path: data/work/map.tar.*
          retention-days: 7
          if-no-files-found: error
      - name: Ins Release legen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ inputs.tag }}
          LABEL: ${{ inputs.label }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
          OSM: ${{ inputs.osm }}
        run: |
          tag="${WANTED:-karte-at-$(date -u +%F)-r$GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Karte von $LABEL (Westösterreich) für den Fahrsimulator – im Spiel unter
          Einstellungen → Karte laden (Kartenpaket).

          Rechteck: $EAST km Ost, $NORTH km Nord (UTM32, EPSG:25832).

          Gebaut am $(date -u +%F) aus OpenStreetMap (© OpenStreetMap-Mitwirkende, ODbL 1.0,
          Ausschnitt $OSM von https://download.geofabrik.de/europe/) und dem
          ALS-DTM-Höhenraster 1 m des Bundesamtes für Eich- und Vermessungswesen (BEV),
          data.bev.gv.at.  Der Metadatensatz des Blattes nennt dazu
          „Der öffentliche Zugang zu diesem Produkt unterliegt keinen Einschränkungen." und
          als Bedingung https://creativecommons.org/licenses/by/4.0/ – das Höhenraster 1 m ist
          unentgeltlich, ein Schlüssel oder eine Anmeldung ist nicht nötig.  Quellenvermerk:
          „© Bundesamt für Eich- und Vermessungswesen (BEV), Wien, CC BY 4.0".  Die Quellen und
          Lizenzen stehen auch in map.json (meta.attribution) und in docs/MAP_DATA.md.

          Keine Gebäudemodelle: Österreich hat kein offenes LoD2 – Bauwerkshöhen lägen nur im
          „Digitalen Landschaftsmodell – Bauwerke" des BEV (Grundrisse mit mittlerer Höhe,
          2,6 GB je Stand), und daraus eigene Einheiten zu schreiben wäre ein zweiter Bau.
          Die Dächer kommen darum aus den OpenStreetMap-Umrissen.

          Keine Fahrpläne: tools/build-timetable.ts holt nur deutsche Lieferungen
          (https://download.gtfs.de); österreichische GTFS-Feeds von ÖBB, VVV, VVT und IVB
          findet es darin nicht.  Die Haltestellen sind da, die Abfahrten fehlen.

          Die Dateien map.tar.00 … sind ein Kartenpaket: sie gehören zusammen und werden im Spiel
          zusammengesetzt.
          EOF
          # auch hier darf der erste Versuch scheitern (403): dreimal, und am Ende steht fest,
          # dass das Release wirklich da ist
          for try in 1 2 3; do
            if gh release create "$tag" --latest=false --target "$GITHUB_SHA" --title "Karte $LABEL" \
              --notes-file notes.md data/work/map.tar.*; then
              break
            fi
            echo "Versuch $try: Release $tag wurde nicht angelegt"
            sleep 30
          done
          gh release view "$tag" --json tagName --jq .tagName
          echo "release $tag"
