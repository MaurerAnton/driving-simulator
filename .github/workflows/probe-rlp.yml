# Kurze Probe: sind die Quellen der Rheinland-Pfalz-Karte von einem GitHub-Läufer aus erreichbar?
name: RLP Quellenprobe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Erreichbarkeit der Quellen
        run: |
          set -euo pipefail
          for u in \
            "https://geobasis-rlp.de/data/dgm1/current/tif/" \
            "https://geobasis-rlp.de/data/dgm1/current/tif/dgm1_32_400_5579_1_rp_2024.tif" \
            "https://geobasis-rlp.de/data/geb3dlo/current/gml/" \
            "https://geobasis-rlp.de/data/geb3dlo/current/gml/LoD2_32_400_5578_2_RP.gml" \
            "https://download.geofabrik.de/europe/germany/rheinland-pfalz/rheinland-pfalz-latest.osm.pbf" \
            "https://geoshop.rlp.de/dl-de_by-2-0.html" ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I -L --max-time 60 -A probe "$u" || echo "curl $?")
            len=$(curl -sS -o /dev/null -w '%{size_download}' -r 0-99 -L --max-time 60 -A probe "$u" || echo "-")
            echo "$code  $len  $u"
          done
