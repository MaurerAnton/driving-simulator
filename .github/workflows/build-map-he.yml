# SPDX-License-Identifier: AGPL-3.0-only
#
# Baut die Karte eines Teils von Hessen und legt sie als Kartenpaket in ein Release
# (map.tar.00, map.tar.01, … – was das Spiel unter Einstellungen → Karte lädt).
#
# Warum das hier läuft: ein Bau braucht mehrere Gigabyte Platte und mehr Speicher, als ein
# Notebook hat; ein Läufer von GitHub hat 4 CPUs, 16 GB Speicher und ~14 GB Platte, und seine
# Minuten sind für ein öffentliches Repository frei.  Die Karte geht nie über GitHub Pages
# (dort sind es 1 GB): Releases haben keine Größenbeschränkung.
#
# Starten: Actions → "Karte Hessen" → Run workflow.
#
# Die Reihenfolge ist die von docs/MAP_DATA.md:
#   1. Gelände (DGM1) und Gebäudemodelle (LoD2) des Landes            -> data/work/dgm2, data/work/lod2
#   2. OpenStreetMap, auf die Region geschnitten                      -> npm run map:extract
#   3. Straßennetz und Kacheln                                        -> npm run map:build
#   4. Adressen, Haltestellen, Linien, Schilder, Fernsicht, Fahrpläne, Tankstellen
#   5. in Teile von 100 MB gepackt und ins Release gelegt
#
# Die Region ist ein Rechteck aus UTM32-Kilometerquadraten (EPSG:25832), dasselbe Gitter, nach
# dem die Kacheln des Landes benannt sind: 533_5685 ist das Quadrat, in dem Kassel liegt.
# Ganz Hessen (21 116 Quadrate) paßt nicht in eine Karte; darum nimmt dieser Lauf ein Rechteck,
# und die weiteren Rechtecke folgen mit demselben Ablauf und anderen Zahlen.  Zwei Abläufe
# dürfen kein Kilometerquadrat gemeinsam haben.

name: Karte Hessen

on:
  workflow_dispatch:
    inputs:
      east_from:
        description: 'Rechteck: erstes Kilometerquadrat nach Osten (UTM32, EPSG:25832)'
        type: string
        default: '526'
      east_to:
        description: 'Rechteck: letztes Kilometerquadrat nach Osten'
        type: string
        default: '540'
      north_from:
        description: 'Rechteck: erstes Kilometerquadrat nach Norden'
        type: string
        default: '5678'
      north_to:
        description: 'Rechteck: letztes Kilometerquadrat nach Norden'
        type: string
        default: '5692'
      label:
        description: Name der Karte (steht im Spiel und im map.json)
        type: string
        default: 'Kassel und Umgebung'
      tag:
        description: 'Name des Releases (leer: karte-he-<Datum>-r<Lauf>)'
        type: string
        default: ''
      districts:
        description: 'Landkreise, aus denen geholt wird (mit Komma getrennt, wie tools/fetch-geodata.py --list sie nennt)'
        type: string
        default: 'Kreisfreie Stadt Kassel, Landkreis Kassel'
      lod2_name:
        description: 'Verzeichnis unter data/work/lod2, in das die Gebäudemodelle kommen'
        type: string
        default: 'Hessen'
      gtfs_agency:
        description: Nahverkehrsbetriebe, deren Fahrpläne genommen werden (RegExp, wie build-timetable.ts sie erwartet)
        type: string
        # NVV = Nordhessischer Verkehrsverbund: Kassel und der Raum um Kassel liegen darin.
        # Ohne diesen Eintrag bekommt keine Linie einen Fahrplan.
        default: '^NVV\b|Nordhessischer VerkehrsVerbund|Nordhessen|Kasseler|RegioTram|DB Regio|cantus|Kurhessenbahn'
      gtfs_bus_agency:
        description: Dieselben für die Buslinien
        type: string
        default: '^NVV\b|Nordhessischer VerkehrsVerbund|Kasseler|RegioBus|Kurhessenbahn'
      geodata_run:
        description: 'Lauf, aus dem schon geholte Geodaten übernommen werden (leer: alles neu holen)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read   # Artefakte eines früheren Laufs (geodata_run)

jobs:
  # 1: die offenen Geodaten des Landes – ein langes Holen
  geodata:
    timeout-minutes: 350
    runs-on: ubuntu-latest
    steps:
      # map-assets/ liegt im Repository (2,7 GB) und wird hier nicht gebraucht: index.json wird
      # aus dem Web geholt (unten), und kein Schritt des Baus liest die fertigen Karten.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !map-assets/
          sparse-checkout-cone-mode: false
      # node ebenfalls: die Gebäudemodelle liest tools/lod2-extract.ts, das selbst nichts holt
      # – das Skript gibt ihm jede .gml –, aber node_modules braucht es (saxes)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy pillow
      # Was ein früherer Lauf schon geholt hat: das Skript läßt liegen, was da ist, und holt
      # nur, was fehlt (die .done-Marken unter data/work/dgm2 und data/work/lod2).
      - name: Vorhandene Geodaten (aus dem Lauf geodata_run)
        if: ${{ inputs.geodata_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.geodata_run }}
        run: |
          set -euo pipefail
          name="geodata-hessen"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?name=$name" --jq '.artifacts[0].id')
          echo "Artefakt von Lauf $RUN: $id"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o /tmp/$name.zip
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('data/work')" "/tmp/$name.zip"
          du -sh data/work/dgm2 data/work/lod2 2>/dev/null || du -sh data/work/dgm2
      # Kein Quadrat zweimal: der Index der schon veröffentlichten Karten sagt, welche
      # Kacheln von 500 m eine andere Karte hat; tools/fetch-he.py läßt sie aus.
      - name: Index der schon veröffentlichten Karten
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 20 \
            -o "$RUNNER_TEMP/published-index.json" \
            https://raw.githubusercontent.com/${{ github.repository }}/main/map-assets/index.json
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/published-index.json'));print('Kacheln in anderen Karten:',len({t for f in d['files'] for t in f['tiles']}))"
      - name: Gelände (DGM1) und Gebäudemodelle (LoD2) holen
        env:
          BOX_E: ${{ inputs.east_from }}..${{ inputs.east_to }}
          BOX_N: ${{ inputs.north_from }}..${{ inputs.north_to }}
          NAME: ${{ inputs.lod2_name }}
          DISTRICTS: ${{ inputs.districts }}
        run: |
          set -euo pipefail
          # Ein Landkreis kommt als ein --district; mehrere stehen mit Komma getrennt im Feld.
          args=()
          while IFS= read -r district; do
            test -n "$district" && args+=(--district "$district")
          done < <(echo "$DISTRICTS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "Landkreise: ${args[*]}"
          python3 -I tools/fetch-he.py --east "$BOX_E" --north "$BOX_N" "${args[@]}" \
            --lod2-name "$NAME" --published "$RUNNER_TEMP/published-index.json" \
            --on-overlap skip --gaps data/work/gaps.txt
          du -sh data/work/dgm2 data/work/lod2 2>/dev/null || du -sh data/work/dgm2
          test -s data/work/dgm2   # ohne Gelände entsteht keine Karte
      # auch nach einem Fehlschlag: Stunden von Holen sind sonst verloren, und der nächste
      # Lauf kann mit geodata_run hier weiterfahren (.done-Marken müssen mit hoch)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodata-hessen
          path: |
            data/work/dgm2
            data/work/lod2
            data/work/he-selected.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # 2-5: OpenStreetMap, der Bau und das Release
  build:
    needs: geodata
    timeout-minutes: 350
    runs-on: ubuntu-latest
    # Die Rechte werden auch hier genannt: das Repository gibt dem Token der Läufe von sich aus
    # nur Leserechte, und ohne contents: write antwortet das Release mit
    # „HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write
    # Das Rechteck liegt außerhalb der Kästen von tools/mapgen/detail-region.json: „all" baut
    # die ganze Karte mit dem feineren Netz.  OSM_FILE: osm-extract.ts, build-lines.ts,
    # build-buslines.ts, build-signs.ts und build-services.ts lesen die OSM-Datei aus
    # process.argv[2].
    env:
      DETAIL_REGION: all
      OSM_FILE: data/raw/osm/hessen-latest.osm.pbf
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !map-assets/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Geodaten des Rechtecks (aus dem ersten Auftrag)
        uses: actions/download-artifact@v4
        with:
          name: geodata-hessen
          path: data/work
      - name: Platz (der Läufer hat ~14 GB SSD; Android, .NET, Haskell und PowerShell braucht diese Karte nicht)
        run: |
          ls data/work
          du -sh data/work/dgm2 data/work/lod2 2>/dev/null || du -sh data/work/dgm2
          ls data/work/dgm2 | head -3
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          df -h /
      - name: OpenStreetMap (Geofabrik, Hessen)
        run: |
          set -euo pipefail
          mkdir -p data/raw/osm
          # Kleinster Ausschnitt mit dem Rechteck: hessen-latest.osm.pbf (348 221 127 Bytes,
          # Stand 21.11.2026, ODbL 1.0, kein Schlüssel – nachgemessen: HTTP 206 auf
          # "Range: bytes=0-999").  Die Adresse „…-latest" zeigt mitunter auf einen Stand, den
          # der Spiegel noch nicht hat; darum werden die Stände der letzten sieben Tage
          # durchprobiert und erst danach auf den Spiegel von openstreetmap.fr
          # (dieselben Daten, dieselbe Lizenz) zurückgefallen.
          urls="https://download.geofabrik.de/europe/germany/hessen/hessen-latest.osm.pbf"
          for back in 0 1 2 3 4 5 6 7; do
            urls="$urls https://download.geofabrik.de/europe/germany/hessen/hessen-$(date -u -d "-$back day" +%y%m%d).osm.pbf"
          done
          urls="$urls https://download.openstreetmap.fr/extracts/europe/germany/hessen-latest.osm.pbf"
          for try in 1 2 3; do
            for url in $urls; do
              rm -f "$OSM_FILE"
              echo "Versuch: $url"
              curl -fsSL --retry 3 --retry-delay 30 --retry-all-errors --connect-timeout 60 \
                -o "$OSM_FILE" "$url" && break 2
              rm -f "$OSM_FILE"
            done
            echo "Runde $try: keine der Adressen hat geliefert"
            sleep 30
          done
          test -s "$OSM_FILE"
          ls -l data/raw/osm
      # Gebaut wird nur, wo Gelände liegt (tools/osm-extract.ts) – das Rechteck ist die Karte.
      - name: Kartenpaket 1/4 – OpenStreetMap in Blöcke von 8 km schneiden
        run: npm run map:extract -- "$OSM_FILE"
      - name: Kartenpaket 2/4 – Straßennetz und Kacheln
        run: npm run map:build -- --jobs 3
      - name: Kartenpaket 3/4 – Adressen, Haltestellen, Linien, Schilder, Fernsicht, Fahrpläne, Tankstellen
        env:
          GTFS_AGENCY: ${{ inputs.gtfs_agency }}
          GTFS_BUS_AGENCY: ${{ inputs.gtfs_bus_agency }}
        run: |
          npm run map:addresses
          npm run map:stops
          # diese vier lesen die OSM-Datei selbst (argv[2]), die anderen beiden das Netz
          npm run map:lines -- "$OSM_FILE"
          npm run map:buslines -- "$OSM_FILE"
          npm run map:signs -- "$OSM_FILE"
          npm run map:far
          npm run map:timetable
          npm run map:services -- "$OSM_FILE"
      # build-graph.ts schreibt Namen und Quellen der hessischen Karte hinein; die Quellen stimmen
      # hier (HVBG, offene Geobasisdaten), nur der Name wird berichtigt.
      - name: Der Name der Karte und ihre Quellen (map.json)
        env:
          NAME: ${{ inputs.label }}
        run: |
          node -e '
            const fs = require("fs"), p = "public/map/map.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.meta.name = process.env.NAME;
            fs.writeFileSync(p, JSON.stringify(j));
            console.log(j.meta.name, "-", j.nodes, "Knoten,", j.edges, "Kanten");
            console.log((j.meta.attribution ?? []).join(" | "));
          '
      - name: Kartenpaket 4/4 – in Teile von 100 MB packen
        run: |
          npm run map:pack
          du -sh public/map
      # Auch wenn das Release nicht klappt: das Paket liegt dann als Artefakt bereit und die
      # Stunden des Bauens sind nicht verloren.
      - uses: actions/upload-artifact@v4
        with:
          name: mappack-he
          path: data/work/map.tar.*
          if-no-files-found: warn
          retention-days: 7
      - name: Ins Release legen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ inputs.tag }}
          LABEL: ${{ inputs.label }}
          BOX: ${{ inputs.east_from }}..${{ inputs.east_to }} / ${{ inputs.north_from }}..${{ inputs.north_to }}
        run: |
          set -euo pipefail
          tag="${WANTED:-karte-he-$(date -u +%F)-r$GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Karte von $LABEL für den Fahrsimulator – im Spiel unter Einstellungen → Karte laden (Kartenpaket).

          Gebaut am $(date -u +%F) aus OpenStreetMap (ODbL 1.0) sowie dem Geländemodell DGM1 und den
          Gebäudemodellen LoD2 der Hessischen Verwaltung für Bodenmanagement und Geoinformation
          (offene Geobasisdaten; Nutzungsbedingungen vom 21.11.2026: „Damit ist jede Nutzung dieser
          Daten ohne Einschränkung oder Bedingung erlaubt").  Rechteck aus Kilometerquadraten
          (UTM32): $BOX.

          Nur ein Rechteck Hessens: das ganze Land paßt nicht in eine Karte; weitere Rechtecke
          kommen aus demselben Ablauf "Karte Hessen" mit anderen Zahlen.
          EOF
          for try in 1 2 3; do
            if gh release create "$tag" --latest=false --target "$GITHUB_SHA" \
                 --title "Karte $LABEL" --notes-file notes.md data/work/map.tar.*; then
              break
            fi
            echo "Versuch $try: Release $tag wurde nicht angelegt"
            sleep 30
          done
          # In diesem Repository ist gh release create gelegentlich verwehrt (HTTP 403
          # „Resource not accessible by integration", bei anderen Bögen gemessen).  Ein
          # verwehrtes Release darf Stunden von Bau nicht wegwerfen: das Paket liegt als
          # Artefakt mappack-he oben und kann von Hand mit gh release create nachgelegt
          # werden.  Darum hier kein harter Fehlschlag, sondern ein Vermerk.
          if gh release view "$tag" --json tagName --jq .tagName; then
            echo "release $tag"
          else
            echo "::warning::Release $tag wurde nicht angelegt – Paket liegt im Artefakt mappack-he"
          fi
