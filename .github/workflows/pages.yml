# Builds the simulator and publishes it to GitHub Pages.
# The map tiles are committed (public/map), so no geodata is downloaded here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (vehicle dynamics, reality view)
        run: npm test
      - run: npm run build
        env:
          # optional: a Mapillary client token for the reality view (repository variable MAPILLARY_TOKEN)
          VITE_MAPILLARY_TOKEN: ${{ vars.MAPILLARY_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
