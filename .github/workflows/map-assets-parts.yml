# SPDX-License-Identifier: AGPL-3.0-only
#
# Makes map parts in the format of map-assets/ (index.json + 1.tar, 2.tar, …) out of
# map packs that are already published in releases – what the game reads in its
# developer mode (world/partcache.ts, world/patchpart.ts, world/tileversions.ts).
#
# Why it runs here: downloading, unpacking and packing several gigabytes needs the disk
# of a runner (~14 GB); nothing of the map is built again – the tiles of a release are
# only sorted into parts – so a run takes minutes, not hours, and no geodata is fetched.
#
# Start it by hand: Actions → "Kartenteile (map-assets)" → Run workflow.
#
# The parts of all the releases named in `releases` go into ONE map-assets/: the numbers
# run through in the order of the input (1.tar … N.tar), and one index.json names them
# all, so several maps share one folder.  `latest` is the highest number.
#
#   index.json   { latest, files: [{ n, file, type, codec, tiles }] }
#   N.tar        one tar per part: every entry is one tile, stored as it is (gzip already),
#                named by its key "412_398", plus a manifest.json with the type of the build
#                and the codec of every entry.  The tiles go in row by row (z, then x), so a
#                part is a band of the map and one download covers the neighbourhood.
#
# A release is only a place to put them down: the game reads the parts from the repository
# (raw.githubusercontent.com, which sends the CORS header a release asset does not), so
# they belong in map-assets/ – see docs, "map parts".

name: Kartenteile (map-assets)

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'Kartenpakete (Releases), in dieser Reihenfolge durchnumeriert (mit Leerzeichen getrennt)'
        type: string
        default: 'karte-suedwest-2026-11-20-r7 karte-suedost-2026-11-20-r7'
      type:
        description: 'Art der Teile: base – wie die Karte sie zum ersten Mal hatte; modified – ein Patch; unstable – ein Versuch'
        type: choice
        default: base
        options: [base, modified, unstable]
      part_mb:
        description: 'Größenziel eines Teils in MiB ( mehr als 100 nimmt GitHub nicht an )'
        type: string
        default: '90'
      start_at:
        description: 'Nummer des ersten Teils (1: ein neues map-assets/; sonst die nächste freie Nummer, wenn die Teile zu einem bestehenden kommen)'
        type: string
        default: '1'
      to_release:
        description: 'Leer: die Teile bleiben ein Artefakt dieses Laufs.  Sonst: ein Release dieses Namens, in das sie kommen.'
        type: string
        default: ''
      commit:
        description: 'Die Teile in das Repository legen (map-assets/) – dort liest das Spiel sie, raw.githubusercontent schickt den CORS-Kopf'
        type: boolean
        default: false
      commit_path:
        description: 'Wohin im Repository (map-assets: die Vorgabe des Spiels)'
        type: string
        default: 'map-assets'

permissions:
  contents: write   # das Kartenpaket lesen, und ein Release schreiben, wenn to_release genannt ist

jobs:
  parts:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node braucht nur die Prüfung: sie liest die Teile mit dem eigenen Code des Spiels
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # ein Kartenpaket nach dem anderen: holen, auspacken, in Teile legen, prüfen, die Karte
      # wieder wegwerfen – so bleibt der Platzbedarf bei einer Karte, nicht bei allen
      - name: Kartenpakete holen und in Teile legen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ inputs.releases }}
          TYPE: ${{ inputs.type }}
          PART_MB: ${{ inputs.part_mb }}
          START_AT: ${{ inputs.start_at }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mkparts2.py" <<'PY'
          import io, json, math, os, sys, tarfile

          mapdir, outdir, ptype, limit, first, fragment = sys.argv[1:7]
          limit, first = int(limit), int(first)
          BLOCK, RESERVE = 512, 1 << 20   # RESERVE: das manifest.json und das Ende des Archivs
          TILES = os.path.join(mapdir, 'tiles')

          def cost(size):
              return BLOCK + math.ceil(size / BLOCK) * BLOCK

          # zeilenweise (z, dann x): so ist ein Teil ein Streifen der Karte
          tiles = []
          for name in os.listdir(TILES):
              if not name.endswith('.fsb'):
                  continue
              key = name[:-4]
              try:
                  six, siz = key.split('_')
                  tiles.append((int(siz), int(six), key, os.path.getsize(os.path.join(TILES, name))))
              except ValueError:
                  continue
          tiles.sort()

          parts, cur, size = [], [], 0
          for _, _, key, nbytes in tiles:
              c = cost(nbytes)
              if cur and size + c > limit - RESERVE:
                  parts.append(cur)
                  cur, size = [], 0
              cur.append(key)
              size += c
          if cur:
              parts.append(cur)

          os.makedirs(outdir, exist_ok=True)
          files = []
          for n, keys in enumerate(parts, start=first):
              # die Kacheln bleiben, wie sie sind – gzip sind sie schon; das manifest sagt es
              manifest = json.dumps({'type': ptype, 'tiles': dict.fromkeys(keys, 'gzip')}, separators=(',', ':')).encode()
              name = '%d.tar' % n
              with tarfile.open(os.path.join(outdir, name), 'w', format=tarfile.USTAR_FORMAT) as tar:
                  info = tarfile.TarInfo('manifest.json')
                  info.size, info.mtime, info.mode = len(manifest), 0, 0o644
                  tar.addfile(info, io.BytesIO(manifest))
                  for key in keys:
                      path = os.path.join(TILES, key + '.fsb')
                      info = tarfile.TarInfo(key)
                      info.size, info.mtime, info.mode = os.path.getsize(path), 0, 0o644
                      with open(path, 'rb') as fh:
                          tar.addfile(info, fh)
              files.append({'n': n, 'file': name, 'type': ptype, 'codec': 'gzip', 'tiles': keys})

          with open(fragment, 'w') as fh:
              json.dump(files, fh, separators=(',', ':'))

          sizes = [os.path.getsize(os.path.join(outdir, f['file'])) for f in files] or [0]
          print(json.dumps({
              'tiles': len(tiles), 'parts': len(files), 'first': first,
              'last': first + len(files) - 1, 'bytes': sum(sizes),
              'part_min': min(sizes), 'part_max': max(sizes),
          }))
          PY
          cat > "$RUNNER_TEMP/checktiles.py" <<'PY'
          import gzip, json, os, sys, tarfile

          mapdir, partsdir, ptype, fragment = sys.argv[1:5]
          files = json.load(open(fragment))
          bad, tiles, seen = [], 0, {}

          def fail(msg):
              bad.append(msg)
              if len(bad) <= 10:
                  print('FAIL: ' + msg)

          for f in files:
              if f['type'] != ptype:
                  fail('%s: Art %s, erwartet %s' % (f['file'], f['type'], ptype))
              with tarfile.open(os.path.join(partsdir, f['file'])) as tar:
                  names = tar.getnames()
                  want_tiles = set(f['tiles'])
                  if 'manifest.json' not in names:
                      fail('%s: kein manifest.json' % f['file'])
                  else:
                      man = json.loads(tar.extractfile('manifest.json').read())
                      if man.get('type') != ptype:
                          fail('%s: manifest-Art %s' % (f['file'], man.get('type')))
                      if set(man.get('tiles') or {}) != want_tiles:
                          fail('%s: das manifest nennt %d Kacheln, der Index %d' % (
                              f['file'], len(man.get('tiles') or {}), len(want_tiles)))
                  entries = set(names) - {'manifest.json'}
                  if entries != want_tiles:
                      fail('%s: %d Einträge, der Index nennt %d' % (f['file'], len(entries), len(want_tiles)))
                  for key in sorted(entries & want_tiles):
                      tiles += 1
                      seen[key] = seen.get(key, 0) + 1
                      got = tar.extractfile(key).read()
                      with open(os.path.join(mapdir, 'tiles', key + '.fsb'), 'rb') as fh:
                          want = fh.read()
                      if got != want:
                          fail('%s: %s weicht von der Kachel der Karte ab' % (f['file'], key))
                      try:
                          gzip.decompress(got)
                      except OSError as err:
                          fail('%s: %s lässt sich nicht entpacken: %s' % (f['file'], key, err))

          on_disk = len([n for n in os.listdir(os.path.join(mapdir, 'tiles')) if n.endswith('.fsb')])
          if len(seen) != on_disk:
              fail('%d Kacheln in den Teilen, %d in der Karte' % (len(seen), on_disk))
          twice = [k for k, n in seen.items() if n > 1]
          if twice:
              fail('%d Kacheln in mehr als einem Teil, z. B. %s' % (len(twice), twice[:3]))
          print(json.dumps({'parts': len(files), 'tiles': tiles, 'type': ptype}))
          if bad:
              print('%d Fehler' % len(bad))
              sys.exit(1)
          print('Prüfung: ja')
          PY
          cat > "$RUNNER_TEMP/checkparts.mjs" <<'JS'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';

          const [mapdir, partsdir, wantType, fragment] = process.argv.slice(2);
          const base = process.env.SRC_BASE ?? `${process.cwd()}/src/world`;
          const { PatchPart } = await import(`file://${base}/patchpart.ts`);

          const fail = (msg) => { console.error('FAIL:', msg); process.exitCode = 1; };
          const files = JSON.parse(readFileSync(fragment, 'utf8'));
          const seen = new Map();
          for (const f of files) {
            if (f.type !== wantType) fail(`${f.file}: Art ${f.type}, erwartet ${wantType}`);
            if (!f.tiles?.length) fail(`${f.file}: keine Kacheln`);
            for (const t of f.tiles) seen.set(t, (seen.get(t) ?? 0) + 1);
            const bytes = readFileSync(join(partsdir, f.file));
            let part;
            try { part = PatchPart.fromBytes(f.n, f.file, bytes); }
            catch (err) { fail(`${f.file}: ${err.message}`); continue; }
            if (part.manifest.type !== wantType) fail(`${f.file}: manifest-Art ${part.manifest.type}`);
            if (part.tiles().length !== f.tiles.length) fail(`${f.file}: ${part.tiles().length} Einträge, das Verzeichnis nennt ${f.tiles.length}`);
            // drei Kacheln von jedem Teil: herauskommen muss die Kachel, wie die Karte sie hat
            for (const key of [f.tiles[0], f.tiles[f.tiles.length >> 1], f.tiles[f.tiles.length - 1]]) {
              const got = await part.file(key);
              if (!got) { fail(`${f.file}: ${key} ist nicht darin`); continue; }
              const want = gunzipSync(readFileSync(join(mapdir, 'tiles', `${key}.fsb`)));
              if (got.length !== want.length) fail(`${f.file}: ${key} ${got.length} Bytes, die Karte hat ${want.length}`);
              else if (Buffer.compare(Buffer.from(got), want) !== 0) fail(`${f.file}: ${key} weicht von der Kachel der Karte ab`);
              if (got[0] === 0x1f && got[1] === 0x8b) fail(`${f.file}: ${key} kommt noch gepackt heraus`);
            }
          }
          const onDisk = readdirSync(join(mapdir, 'tiles')).filter((n) => n.endsWith('.fsb')).length;
          if (seen.size !== onDisk) fail(`${seen.size} Kacheln in den Teilen, ${onDisk} in der Karte`);
          const twice = [...seen].filter(([, n]) => n > 1).map(([t]) => t);
          if (twice.length) fail(`${twice.length} Kacheln in mehr als einem Teil, z. B. ${twice.slice(0, 3)}`);
          console.log(JSON.stringify({ parts: files.length, tiles: seen.size, type: wantType,
            bytes: files.reduce((a, f) => a + statSync(join(partsdir, f.file)).size, 0) }));
          console.log(process.exitCode ? 'Prüfung: nein' : 'Prüfung: ja');
          JS

          wanted=$(( PART_MB * 1048576 ))
          echo "Teile von höchstens $wanted Bytes ($PART_MB MiB)"
          mkdir -p parts
          : > "$RUNNER_TEMP/tags"
          first=$START_AT
          i=0
          for tag in $RELEASES; do
            i=$(( i + 1 ))
            work="work/$i"
            mkdir -p "$work"
            echo "== $tag =="
            gh release download "$tag" --pattern 'map.tar.*' -D "$work"
            # die Teile gehören zusammen: zusammengesetzt sind sie wieder ein tar (map/)
            ( cd "$work" && cat map.tar.* > map.tar && rm -f map.tar.* && tar xf map.tar && rm -f map.tar )
            echo "Karte: $(du -sh "$work/map" | cut -f1), $(find "$work/map/tiles" -name '*.fsb' | wc -l) Kacheln"
            python3 "$RUNNER_TEMP/mkparts2.py" "$work/map" parts "$TYPE" "$wanted" "$first" "$RUNNER_TEMP/frag-$i.json" \
              | tee "$RUNNER_TEMP/part-$i.json"
            # geprüft, solange die Karte noch da ist: jede Kachel, die aus einem Teil kommt,
            # muss die der Karte sein – Byte für Byte
            python3 "$RUNNER_TEMP/checktiles.py" "$work/map" parts "$TYPE" "$RUNNER_TEMP/frag-$i.json"
            # und, wenn der Code des Spiels schon im Repository liegt, auch mit ihm
            if [ -f src/world/patchpart.ts ]; then
              SRC_BASE="$GITHUB_WORKSPACE/src/world" node "$RUNNER_TEMP/checkparts.mjs" \
                "$work/map" parts "$TYPE" "$RUNNER_TEMP/frag-$i.json"
            else
              echo "::notice::src/world/patchpart.ts liegt nicht im Repository – die Prüfung mit dem Code des Spiels entfällt (jede Kachel wurde mit Python geprüft)"
            fi
            first=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))[-1]['n']+1)" "$RUNNER_TEMP/frag-$i.json")
            echo "$tag" >> "$RUNNER_TEMP/tags"
            echo "$RUNNER_TEMP/frag-$i.json" >> "$RUNNER_TEMP/fragments"
            # die Region: die Karte als Region in map-assets/regions/<id>/ (map.json, net, w/, kleine Dateien)
            # – die Region, die das Spiel lädt, wenn man sie in den Einstellungen wählt (world/regionfiles.ts).
            # Die Karte ist noch da: die Dateien kommen, bevor work weg ist.
            if [ -f tools/build-regions.ts ]; then
              rid=$(echo "$tag" | sed -E 's/^karte-//; s/--[0-9]+[0-9]{4}-[0-9]{2}-[0-9]{2}$//; s/-[0-9]{4}-[0-9]{2}-[0-9]{2}(-r[0-9]+)?$//')
              # (the Lower Saxony campaign named its releases karte-niedersachsen-<ort>--<n><datum>: the second
              #  rule takes that off, so the region is niedersachsen-<ort>)
              echo "Region: $rid (aus $tag)"
              # die Teile dieses Laufs (aus dem Fragment) tragen die Kacheln der Region:
              # build-regions bekommt sie, damit regions.json sagt, welcher Teil sie hält
              tileargs=()
              if [ -f "$RUNNER_TEMP/frag-$i.json" ]; then
                while IFS= read -r f; do tileargs+=(--tiles "$f"); done < <(python3 -c "import json,sys; [print(x['file']) for x in json.load(open(sys.argv[1]))]" "$RUNNER_TEMP/frag-$i.json")
              fi
              node tools/build-regions.ts --map "$work/map" --id "$rid" \
                --out "$RUNNER_TEMP/region-assets" --index "$RUNNER_TEMP/regions.json" \
                "${tileargs[@]}" \
                | tee "$RUNNER_TEMP/region-$i.json"
              echo "$rid" >> "$RUNNER_TEMP/region-ids"
              echo "$tag" >> "$RUNNER_TEMP/region-tags"
            else
              echo "::notice::tools/build-regions.ts liegt nicht im Repository – die Region wird nicht mitgeschrieben"
            fi
            rm -rf "$work"
            df -h / | tail -1
          done
          echo "$i Karten, $(find parts -name '*.tar' | wc -l) Teile"

      - name: index.json zusammensetzen
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mergeindex.py" <<'PY'
          import json, os, sys

          outdir, fragments = sys.argv[1], sys.argv[2:]
          files, seen_n, tiles, twice = [], set(), {}, []
          for path in fragments:
              for f in json.load(open(path)):
                  if f['n'] in seen_n:
                      sys.exit('Nummer %s kommt zweimal vor' % f['n'])
                  seen_n.add(f['n'])
                  files.append(f)
                  for t in f['tiles']:
                      if t in tiles:
                          twice.append(t)
                      tiles[t] = f['n']
          files.sort(key=lambda f: f['n'])
          index = {'latest': files[-1]['n'], 'files': files}
          with open(os.path.join(outdir, 'index.json'), 'w') as fh:
              json.dump(index, fh, separators=(',', ':'))

          sizes = [os.path.getsize(os.path.join(outdir, f['file'])) for f in files]
          print(json.dumps({
              'parts': len(files), 'latest': index['latest'], 'tiles': len(tiles),
              'bytes': sum(sizes), 'part_min': min(sizes), 'part_max': max(sizes),
              'index_bytes': os.path.getsize(os.path.join(outdir, 'index.json')),
              'tiles_in_two_parts': twice[:5], 'tiles_in_two_parts_count': len(twice),
          }))
          PY
          python3 "$RUNNER_TEMP/mergeindex.py" parts $(cat "$RUNNER_TEMP/fragments") | tee "$RUNNER_TEMP/report.json"

      # die Karten sind weg – jetzt zählt nur noch, was das Spiel aus dem einen map-assets/ liest
      - name: Prüfen – das zusammengesetzte map-assets lesen (Python, und der Code des Spiels, wenn er im Repository liegt)
        env:
          TYPE: ${{ inputs.type }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/checkmerged.py" <<'PY'
          import gzip, json, os, sys, tarfile

          partsdir, ptype, want_tiles = sys.argv[1], sys.argv[2], int(sys.argv[3] or 0)
          index = json.load(open(os.path.join(partsdir, 'index.json')))
          files = index['files']
          bad = []

          def fail(msg):
              bad.append(msg)
              if len(bad) <= 10:
                  print('FAIL: ' + msg)

          nums = [f['n'] for f in files]
          if len(set(nums)) != len(nums):
              fail('eine Nummer kommt zweimal vor')
          if index.get('latest') != max(nums):
              fail('latest %s ist nicht die höchste Nummer %s' % (index.get('latest'), max(nums)))
          if sorted(nums) != list(range(min(nums), min(nums) + len(nums))):
              fail('die Nummern laufen nicht ohne Lücke durch')
          tiles = 0
          keys = set()
          for f in files:
              if f['type'] != ptype:
                  fail('%s: Art %s, erwartet %s' % (f['file'], f['type'], ptype))
              keys.update(f['tiles'])
              with tarfile.open(os.path.join(partsdir, f['file'])) as tar:
                  entries = set(tar.getnames()) - {'manifest.json'}
                  if len(entries) != len(f['tiles']):
                      fail('%s: %d Einträge, der Index nennt %d' % (f['file'], len(entries), len(f['tiles'])))
                  try:
                      gzip.decompress(tar.extractfile(f['tiles'][0]).read())
                  except OSError as err:
                      fail('%s: %s lässt sich nicht entpacken: %s' % (f['file'], f['tiles'][0], err))
              tiles += len(f['tiles'])
          # eine Kachel, die in zwei Teilen liegt, liegt in zwei Karten (Grenzkacheln) – erlaubt,
          # verglichen wird die Zahl der verschiedenen Kacheln
          if want_tiles and len(keys) != want_tiles:
              fail('%d verschiedene Kacheln im Index, %d erwartet' % (len(keys), want_tiles))
          print(json.dumps({'parts': len(files), 'latest': index.get('latest'), 'tiles': len(keys),
                            'entries': tiles, 'type': ptype}))
          if bad:
              print('%d Fehler' % len(bad))
              sys.exit(1)
          print('Prüfung: ja')
          PY
          python3 "$RUNNER_TEMP/checkmerged.py" parts "$TYPE" \
            "$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/report.json'))['tiles'])")"
          cat > "$RUNNER_TEMP/checkmerged.mjs" <<'JS'
          import { readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          const [partsdir, wantType, wantTiles] = process.argv.slice(2);
          const base = process.env.SRC_BASE ?? `${process.cwd()}/src/world`;
          const { parseIndex } = await import(`file://${base}/tileversions.ts`);
          const { PatchPart } = await import(`file://${base}/patchpart.ts`);

          const fail = (msg) => { console.error('FAIL:', msg); process.exitCode = 1; };
          const index = parseIndex(JSON.parse(readFileSync(join(partsdir, 'index.json'), 'utf8')));
          if (!index) fail('index.json ist nicht lesbar');
          else {
            const n = index.files.map((f) => f.n);
            if (new Set(n).size !== n.length) fail('eine Nummer kommt zweimal vor');
            if (index.latest !== Math.max(...n)) fail(`latest ${index.latest} ist nicht die höchste Nummer ${Math.max(...n)}`);
            if ([...n].sort((a, b) => a - b).some((v, i) => v !== Math.min(...n) + i)) fail('die Nummern laufen nicht ohne Lücke durch');
            let tiles = 0;
            const keys = new Set();
            for (const f of index.files) {
              if (f.type !== wantType) fail(`${f.file}: Art ${f.type}, erwartet ${wantType}`);
              const part = PatchPart.fromBytes(f.n, f.file, readFileSync(join(partsdir, f.file)));
              if (part.tiles().length !== f.tiles.length) fail(`${f.file}: ${part.tiles().length} Einträge, der Index nennt ${f.tiles.length}`);
              tiles += f.tiles.length;
              for (const t of f.tiles) keys.add(t);
              // eine Kachel je Teil: sie muss dekodiert herauskommen, nicht mehr gepackt
              const got = await part.file(f.tiles[0]);
              if (!got) fail(`${f.file}: ${f.tiles[0]} ist nicht darin`);
              else if (got[0] === 0x1f && got[1] === 0x8b) fail(`${f.file}: ${f.tiles[0]} kommt noch gepackt heraus`);
            }
            // Grenzkacheln liegen in zwei Karten und damit in zwei Teilen – verglichen wird die
            // Zahl der verschiedenen Kacheln
            if (wantTiles && keys.size !== Number(wantTiles)) fail(`${keys.size} verschiedene Kacheln im Index, ${wantTiles} erwartet`);
            console.log(JSON.stringify({ parts: index.files.length, latest: index.latest, tiles: keys.size, entries: tiles, type: wantType,
              bytes: index.files.reduce((a, f) => a + statSync(join(partsdir, f.file)).size, 0),
              index_bytes: statSync(join(partsdir, 'index.json')).size }));
          }
          console.log(process.exitCode ? 'Prüfung: nein' : 'Prüfung: ja');
          JS
          # dazu, wenn der Code des Spiels schon im Repository liegt, auch mit ihm
          if [ -f src/world/patchpart.ts ]; then
            SRC_BASE="$GITHUB_WORKSPACE/src/world" node "$RUNNER_TEMP/checkmerged.mjs" parts "$TYPE" \
              "$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/report.json'))['tiles'])")"
          else
            echo "::notice::src/world/patchpart.ts liegt nicht im Repository – die Prüfung mit dem Code des Spiels entfällt"
          fi

      - name: Zusammenfassung
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, sys

          temp = sys.argv[1]
          report = json.load(open(os.path.join(temp, 'report.json')))
          tags = [t.strip() for t in open(os.path.join(temp, 'tags')) if t.strip()]
          parts = [json.load(open(p)) for p in sorted(glob.glob(os.path.join(temp, 'part-*.json')),
                                                             key=lambda p: int(p.rsplit('-', 1)[1].split('.')[0]))]

          print('## Kartenteile (map-assets)')
          print('')
          print('| Karte | Kacheln | Teile | MB |')
          print('|---|---|---|---|')
          for tag, p in zip(tags, parts):
              print('| %s | %d | %d (%d…%d) | %.1f |' % (tag, p['tiles'], p['parts'], p['first'], p['last'], p['bytes'] / 1048576))
          print('')
          print('| | |')
          print('|---|---|')
          print('| Teile zusammen | %d |' % report['parts'])
          print('| Kacheln | %d |' % report['tiles'])
          print('| zusammen | %.1f MB |' % (report['bytes'] / 1048576))
          print('| ein Teil | %.1f – %.1f MB |' % (report['part_min'] / 1048576, report['part_max'] / 1048576))
          print('| index.json | %.1f KB |' % (report['index_bytes'] / 1024))
          print('| latest | %d |' % report['latest'])
          if report['tiles_in_two_parts_count']:
              print('| Kacheln in zwei Teilen | %d, z. B. %s |' % (
                  report['tiles_in_two_parts_count'], ', '.join(report['tiles_in_two_parts'])))
          PY
          du -sh parts

      - uses: actions/upload-artifact@v4
        with:
          name: map-assets
          path: parts
          retention-days: 30
          if-no-files-found: error

      # die Teile gleich dorthin legen, wo das Spiel sie liest: map-assets/ im Repository
      # (raw.githubusercontent schickt den CORS-Kopf, ein Release nicht).  Ein Push darf
      # höchstens 2 GiB sein – darum in Häppchen von vier Teilen, und der Index zuletzt,
      # damit er nie auf eine Datei zeigt, die noch nicht da ist.
      - name: In das Repository legen (map-assets/)
        if: ${{ inputs.commit }}
        env:
          TARGET: ${{ inputs.commit_path }}
          START_AT: ${{ inputs.start_at }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::In das Repository legen geht nur von main aus (dieser Lauf ist ${GITHUB_REF_NAME})"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          mkdir -p "$TARGET"
          # Weg damit ist nur, was dieser Lauf neu schreibt: die Teilnummern first…last.
          # Alle übrigen Teile gehören zu Karten früherer Läufe und müssen bleiben – sonst
          # verschwindet mit jedem Lauf die Karte der Länder von vorher.
          mapfile -t files < <(ls parts/*.tar | sort -V)
          n=${#files[@]}
          first=${START_AT:-1}
          num_last=$(( first + n - 1 ))
          for old in "$TARGET"/*.tar; do
            [ -e "$old" ] || continue
            num=${old##*/}; num=${num%.tar}
            case "$num" in ''|*[!0-9]*) continue ;; esac
            [ "$num" -ge "$first" ] && [ "$num" -le "$num_last" ] || continue
            [ -f "parts/$(basename "$old")" ] || rm -f "$old"
          done
          batch=4
          pushed=0
          for (( i = 0; i < n; i += batch )); do
            last=$(( i + batch ))
            if [ "$last" -gt "$n" ]; then last=$n; fi
            for (( j = i; j < last; j++ )); do cp "${files[j]}" "$TARGET/"; done
            git add "$TARGET"
            if git diff --cached --quiet; then continue; fi
            git commit -q -m "map-assets: parts $(( i + 1 ))…$last of $n"
            git push --quiet origin HEAD:main
            pushed=$(( pushed + 1 ))
            echo "Teile $(( i + 1 ))…$last sind im Repository"
          done
          # Der Index dieses Laufs kennt nur seine eigenen Teile; die Einträge der übrigen
          # (die Karten früherer Läufe) nimmt er aus dem Index, der schon im Repository liegt.
          python3 - "$TARGET" "$first" "$num_last" <<'PY'
          import json, os, sys

          target, first, last = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          new = json.load(open('parts/index.json'))
          path = os.path.join(target, 'index.json')
          old = json.load(open(path)) if os.path.exists(path) else {'files': []}
          kept = [f for f in old['files'] if not first <= f['n'] <= last]
          files = sorted(kept + new['files'], key=lambda f: f['n'])
          json.dump({'latest': files[-1]['n'], 'files': files}, open(path, 'w'), separators=(',', ':'))
          print(f'index.json: {len(kept)} Teile von früher + {len(new["files"])} von diesem Lauf '
                f'= {len(files)} insgesamt, höchste Nummer {files[-1]["n"]}')
          PY
          all=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["files"]))' "$TARGET/index.json")
          git add "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -q -m "map-assets: index of $all parts"
            git push --quiet origin HEAD:main
            pushed=$(( pushed + 1 ))
          fi
          echo "$pushed Pushes, $(du -sh "$TARGET" | cut -f1) in $TARGET"
          git log --oneline -n "$pushed"

      # die Regionen dieses Laufs: map-assets/regions/<id>/ und regions.json – was das Spiel
      # lädt, wenn man eine Region in den Einstellungen wählt (world/regionfiles.ts).  Die
      # Regionen früherer Läufe bleiben: regions.json wird mit dem, was schon da ist, zusammen-
      # gesetzt (wie der Teil-Index), und jedes regions/<id>/ wird nur überschrieben, wenn dieser
      # Lauf es neu geschrieben hat.
      - name: Regionen in das Repository legen (map-assets/regions/)
        if: ${{ inputs.commit }}
        env:
          TARGET: ${{ inputs.commit_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/regions.json" ]; then
            echo "Keine Regionen in diesem Lauf – nichts zu schreiben"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          # die Regionen dieses Laufs: ihre Ordner
          mkdir -p "$TARGET/regions"
          if [ -d "$RUNNER_TEMP/region-assets/regions" ]; then
            cp -r "$RUNNER_TEMP/region-assets/regions/." "$TARGET/regions/"
          fi
          # regions.json: die Einträge dieses Laufs ersetzen die gleicher ids, die übrigen bleiben
          python3 - "$TARGET" "$RUNNER_TEMP/regions.json" <<'PY'
          import json, os, sys

          target, new_path = sys.argv[1], sys.argv[2]
          path = os.path.join(target, 'regions.json')
          new = json.load(open(new_path))
          old = json.load(open(path)) if os.path.exists(path) else {'regions': []}
          by_id = {r['id']: r for r in old.get('regions', [])}
          for r in new.get('regions', []):
              by_id[r['id']] = r
          regions = list(by_id.values())
          # latest: die Region dieses Laufs, sonst die, die schon da war
          latest = new.get('latest') or old.get('latest') or (regions[0]['id'] if regions else '')
          if latest not in by_id:
              latest = regions[0]['id'] if regions else ''
          json.dump({'latest': latest, 'regions': regions}, open(path, 'w'), indent=2, ensure_ascii=False)
          print(f'regions.json: {len(old.get("regions", []))} von früher + {len(new.get("regions", []))} von diesem Lauf = {len(regions)}, latest {latest}')
          PY
          git add "$TARGET/regions" "$TARGET/regions.json"
          if ! git diff --cached --quiet; then
            n=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["regions"]))' "$TARGET/regions.json")
            git commit -q -m "map-assets: regions ($n)"
            git push --quiet origin HEAD:main
            echo "Regionen sind im Repository ($n insgesamt)"
            git log --oneline -n 1
          else
            echo "Regionen unverändert"
          fi

      # nur wenn ein Name genannt ist: die Teile in ein Release legen – von dort holt man sie
      # herunter und legt sie unter map-assets/ im Repository ab (nur so kommen sie mit CORS
      # zum Spiel)
      - name: Ins Release legen
        if: ${{ inputs.to_release != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.to_release }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Kartenteile im Format map-assets: index.json und die Tar-Dateien – zum Ablegen unter map-assets/ im Repository."
          gh release upload "$TAG" parts/index.json parts/*.tar --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort
